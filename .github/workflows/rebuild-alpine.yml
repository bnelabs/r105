name: Rebuild Alpine release package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive the Alpine package
        required: true
        type: string

permissions:
  contents: write

jobs:
  alpine:
    name: Build and attach Alpine package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "release_tag must look like vX.Y.Z" >&2; exit 1 ;;
          esac
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Build native musl executable and APK
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          output_root="$RUNNER_TEMP/r105-alpine"
          mkdir -p "$output_root"
          docker run --rm -e VERSION="$VERSION" \
            -w /workspace \
            -v "$GITHUB_WORKSPACE:/workspace" -v "$output_root:/out" \
            rust:1.89-alpine3.22 sh -euxc '
              apk add --no-cache alpine-sdk build-base cmake perl
              cargo build --release --locked
              adduser -D builder
              addgroup builder abuild
              mkdir -p /var/cache/distfiles /workspace/alpine-package
              chgrp abuild /var/cache/distfiles
              chmod g+w /var/cache/distfiles
              cp /workspace/target/release/r105 /workspace/alpine-package/r105
              cp /workspace/LICENSE /workspace/README.md /workspace/alpine-package/
              sed "s/@VERSION@/${VERSION}/g" /workspace/packaging/alpine/APKBUILD.in \
                > /workspace/alpine-package/APKBUILD
              chown -R builder:abuild /workspace/alpine-package
              su builder -s /bin/ash -c "cd /workspace/alpine-package && abuild-keygen -a -n && abuild checksum"
              install -m 0644 /home/builder/.abuild/*.rsa.pub /etc/apk/keys/
              su builder -s /bin/ash -c "cd /workspace/alpine-package && abuild"
              package=$(find /home/builder/packages -type f -name "r105-${VERSION}-r0.apk" -print -quit)
              test -n "$package"
              cp "$package" "/out/r105-${VERSION}-r0.apk"
              mkdir -p /tmp/r105-root
              tar -xzf "/out/r105-${VERSION}-r0.apk" -C /tmp/r105-root
              /tmp/r105-root/usr/bin/r105 --version
            '
          test -f "$output_root/r105-${VERSION}-r0.apk"

      - name: Refresh release checksums and upload Alpine package
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          output_root="$RUNNER_TEMP/r105-alpine"
          release_dir="$RUNNER_TEMP/r105-release"
          mkdir -p "$release_dir"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$release_dir" \
            --pattern '*'
          cp "$output_root/r105-${VERSION}-r0.apk" "$release_dir/"
          rm -f "$release_dir/SHA256SUMS"
          (cd "$release_dir" && sha256sum * > SHA256SUMS)
          gh release upload "$RELEASE_TAG" \
            "$release_dir/r105-${VERSION}-r0.apk" \
            "$release_dir/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --clobber
