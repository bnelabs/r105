name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check release metadata
        run: ./packaging/check_release.sh

      - name: Check all targets
        run: cargo check --all-targets --all-features --locked

      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Validate CLI and schema
        run: |
          cargo run --locked -- --version
          cargo run --locked -- --help
          cargo run --locked -- config-schema --output "$RUNNER_TEMP/r105-config-schema.json"
          test -s "$RUNNER_TEMP/r105-config-schema.json"

      - name: Check optional Python bridge reference
        run: |
          python3 -m py_compile bridge/r105_python_bridge.py
          cargo run --locked -- bridge --command "python3 bridge/r105_python_bridge.py"

  smoke:
    # The release workflow ships binaries for Linux, macOS, and Windows. Keep
    # a native build and CLI smoke test on the two non-Linux runner families.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: CLI smoke (help + version)
        run: cargo run --locked -- --help && cargo run --locked -- --version

      - name: Build smoke
        run: cargo build --locked
