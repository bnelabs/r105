name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check r105/ tests/

      - name: Type-check with mypy
        run: mypy r105/

      - name: Run tests with coverage
        run: python -m pytest tests/ -v --cov=r105 --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov (Python 3.12 only)
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          fail_ci_if_error: false

  smoke:
    # Cross-platform smoke test: the release workflow ships binaries for
    # Linux, macOS, and Windows, so at least import + CLI surface must be
    # exercised beyond Linux. Full sandbox tests stay Linux-only.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import check
        run: python -c "import r105.client, r105.tools, r105.tui.app; print('imports ok')"

      - name: CLI smoke (help + version)
        run: |
          python -m r105 --help
          python -m r105 --version

      - name: Doctor smoke (offline checks)
        run: python -m r105 doctor
        continue-on-error: true
