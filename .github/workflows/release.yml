name: Release (Rust binaries and native packages)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Check tag, Cargo, lockfile, and changelog
        run: ./packaging/check_release.sh --tag "$GITHUB_REF_NAME"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check and test
        run: |
          cargo check --all-targets --all-features --locked
          cargo test --all-targets --all-features --locked
      - name: Lint release sources
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  binaries:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux x86_64
            target: x86_64-unknown-linux-gnu
            asset: r105-linux-x86_64.tar.gz
            cross: false
          - os: ubuntu-22.04
            name: Linux aarch64
            target: aarch64-unknown-linux-gnu
            asset: r105-linux-aarch64.tar.gz
            cross: true
          - os: macos-latest
            name: macOS x86_64
            target: x86_64-apple-darwin
            asset: r105-macos-x86_64.tar.gz
            cross: false
          - os: macos-latest
            name: macOS arm64
            target: aarch64-apple-darwin
            asset: r105-macos-arm64.tar.gz
            cross: false
          - os: windows-latest
            name: Windows x86_64
            target: x86_64-pc-windows-msvc
            asset: r105-windows-x86_64.zip
            cross: false
          - os: windows-latest
            name: Windows arm64
            target: aarch64-pc-windows-msvc
            asset: r105-windows-arm64.zip
            cross: false
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install cross
        if: ${{ matrix.cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build Unix target
        if: ${{ !startsWith(matrix.target, 'x86_64-pc-windows') && !startsWith(matrix.target, 'aarch64-pc-windows') }}
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi
      - name: Build Windows target
        if: ${{ startsWith(matrix.target, 'x86_64-pc-windows') || startsWith(matrix.target, 'aarch64-pc-windows') }}
        shell: pwsh
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Archive Unix target
        if: ${{ !startsWith(matrix.target, 'x86_64-pc-windows') && !startsWith(matrix.target, 'aarch64-pc-windows') }}
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/r105-stage"
          mkdir -p "$stage"
          install -m 0755 "target/${{ matrix.target }}/release/r105" "$stage/r105"
          install -m 0644 LICENSE README.md "$stage/"
          mkdir -p release
          tar -C "$stage" -czf "release/${{ matrix.asset }}" r105 LICENSE README.md
      - name: Archive Windows target
        if: ${{ startsWith(matrix.target, 'x86_64-pc-windows') || startsWith(matrix.target, 'aarch64-pc-windows') }}
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "r105-stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/r105.exe" "$stage/r105.exe"
          Copy-Item LICENSE,README.md "$stage/"
          New-Item -ItemType Directory -Force release | Out-Null
          Push-Location $stage
          7z a (Join-Path $env:GITHUB_WORKSPACE "release/${{ matrix.asset }}") r105.exe LICENSE README.md
          Pop-Location
      - name: Smoke test Unix
        if: ${{ !startsWith(matrix.target, 'x86_64-pc-windows') && !startsWith(matrix.target, 'aarch64-pc-windows') && matrix.target != 'aarch64-unknown-linux-gnu' }}
        shell: bash
        run: target/${{ matrix.target }}/release/r105 --version
      - name: Smoke test Windows
        if: ${{ (startsWith(matrix.target, 'x86_64-pc-windows') || startsWith(matrix.target, 'aarch64-pc-windows')) && matrix.target != 'aarch64-pc-windows-msvc' }}
        shell: pwsh
        run: target/${{ matrix.target }}/release/r105.exe --version
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.asset }}
          path: release/*
          if-no-files-found: error

  linux-packages:
    name: Build Linux distribution packages
    needs: binaries
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: binary-r105-linux-x86_64.tar.gz
          path: artifacts/linux
      - name: Install package builders
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')
          archive=$(find artifacts/linux -name 'r105-linux-x86_64.tar.gz' -print -quit)
          test -n "$archive"
          stage="$RUNNER_TEMP/r105-linux-stage"
          mkdir -p "$stage"
          tar -xzf "$archive" -C "$stage"

          deb_root="$RUNNER_TEMP/r105-deb"
          mkdir -p "$deb_root/DEBIAN" "$deb_root/usr/bin" "$deb_root/usr/share/doc/r105"
          install -m 0755 "$stage/r105" "$deb_root/usr/bin/r105"
          install -m 0644 LICENSE "$deb_root/usr/share/doc/r105/copyright"
          install -m 0644 README.md "$deb_root/usr/share/doc/r105/README.md"
          sed "s/@VERSION@/$VERSION/g" packaging/debian/control.in > "$deb_root/DEBIAN/control"
          mkdir -p dist
          dpkg-deb --build --root-owner-group "$deb_root" "dist/r105_"$VERSION"_amd64.deb"
          dpkg-deb --info "dist/r105_"$VERSION"_amd64.deb"

          rpm_root="$RUNNER_TEMP/rpmbuild"
          mkdir -p "$rpm_root/BUILD" "$rpm_root/BUILDROOT" "$rpm_root/RPMS" "$rpm_root/SOURCES" "$rpm_root/SPECS" "$rpm_root/SRPMS"
          cp "$stage/r105" "$rpm_root/SOURCES/r105"
          cp LICENSE "$rpm_root/SOURCES/LICENSE"
          cp README.md "$rpm_root/SOURCES/README.md"
          release_date=$(date -u '+%a %b %d %Y')
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@RELEASE_DATE@/$release_date/g" packaging/fedora/r105.spec.in > "$rpm_root/SPECS/r105.spec"
          rpmbuild --define "_topdir $rpm_root" -bb "$rpm_root/SPECS/r105.spec"
          cp "$rpm_root/RPMS/x86_64/r105-$VERSION-1.x86_64.rpm" dist/
          rpm -qpl "dist/r105-$VERSION-1.x86_64.rpm"

          arch_root="$RUNNER_TEMP/r105-arch"
          mkdir -p "$arch_root"
          cp "$stage/r105" LICENSE README.md "$arch_root/"
          sed "s/@VERSION@/$VERSION/g" packaging/arch/PKGBUILD.in > "$arch_root/PKGBUILD"
          docker run --rm -v "$arch_root:/build" archlinux:base-devel bash -euc '
            useradd --create-home builder
            chown -R builder:builder /build
            runuser -u builder -- bash -euc "cd /build && makepkg --noconfirm --nodeps --clean"
          '
          cp "$arch_root/r105-$VERSION-1-x86_64.pkg.tar.zst" dist/
          test -f "dist/r105-$VERSION-1-x86_64.pkg.tar.zst"
      - uses: actions/upload-artifact@v7
        with:
          name: package-linux
          path: dist/*
          if-no-files-found: error

  freebsd:
    name: Build FreeBSD amd64 package
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Build on FreeBSD 14
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14"
          usesh: true
          mem: 8192
          copyback: true
          prepare: |
            pkg update -f
            pkg install -y ca_root_nss rust pkgconf
          run: |
            set -eu
            VERSION=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')
            cargo build --release --locked
            mkdir -p freebsd-stage/usr/local/bin \
              freebsd-stage/usr/local/share/licenses/r105 \
              freebsd-stage/usr/local/share/doc/r105 \
              dist
            install -m 0755 target/release/r105 freebsd-stage/usr/local/bin/r105
            install -m 0644 LICENSE freebsd-stage/usr/local/share/licenses/r105/LICENSE
            install -m 0644 README.md freebsd-stage/usr/local/share/doc/r105/README.md
            abi=$(pkg -vv | sed -n 's/^[[:space:]]*ABI = "\([^"]*\)".*/\1/p' | head -n 1)
            test -n "$abi"
            r105_sha=$(sha256 -q freebsd-stage/usr/local/bin/r105)
            license_sha=$(sha256 -q freebsd-stage/usr/local/share/licenses/r105/LICENSE)
            readme_sha=$(sha256 -q freebsd-stage/usr/local/share/doc/r105/README.md)
            sed -e "s/@VERSION@/$VERSION/g" \
                -e "s/@ABI@/$abi/g" \
                -e "s/@R105_SHA256@/$r105_sha/g" \
                -e "s/@LICENSE_SHA256@/$license_sha/g" \
                -e "s/@README_SHA256@/$readme_sha/g" \
                packaging/freebsd/manifest.ucl.in > freebsd-manifest.ucl
            pkg create -M freebsd-manifest.ucl -r freebsd-stage -o dist
            package=$(find dist -maxdepth 1 -type f -name "r105-$VERSION.pkg" -print -quit)
            test -n "$package"
            mv "$package" "dist/r105-$VERSION-freebsd-amd64.pkg"
            freebsd-stage/usr/local/bin/r105 --version
      - uses: actions/upload-artifact@v7
        with:
          name: package-freebsd
          path: dist/r105-*.pkg
          if-no-files-found: error

  alpine:
    name: Build Alpine x86_64 musl package
    needs: validate
    continue-on-error: true
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Build native Alpine package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')
          output_root="$RUNNER_TEMP/r105-alpine"
          mkdir -p "$output_root"
          docker run --rm --platform linux/amd64 -e VERSION="$VERSION" \
            -w /workspace \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$output_root:/out" \
            rust:1.89-alpine3.22 sh -euxc '
              apk add --no-cache alpine-sdk build-base cmake perl
              cargo build --release --locked
              adduser -D builder
              addgroup builder abuild
              mkdir -p /var/cache/distfiles /workspace/alpine-package
              chgrp abuild /var/cache/distfiles
              chmod g+w /var/cache/distfiles
              cp /workspace/target/release/r105 /workspace/alpine-package/r105
              cp /workspace/LICENSE /workspace/README.md /workspace/alpine-package/
              sed "s/@VERSION@/$VERSION/g" /workspace/packaging/alpine/APKBUILD.in > /workspace/alpine-package/APKBUILD
              chown -R builder:abuild /workspace/alpine-package
              su builder -s /bin/ash -c "cd /workspace/alpine-package && abuild-keygen -a -n && abuild checksum"
              install -m 0644 /home/builder/.abuild/*.rsa.pub /etc/apk/keys/
              su builder -s /bin/ash -c "cd /workspace/alpine-package && abuild"
              package=$(find /home/builder/packages -type f -name "r105-$VERSION-r0.apk" -print -quit)
              test -n "$package"
              cp "$package" "/out/r105-$VERSION-r0.apk"
              mkdir -p /tmp/r105-root
              tar -xzf "/out/r105-$VERSION-r0.apk" -C /tmp/r105-root
              /tmp/r105-root/usr/bin/r105 --version
            '
          mkdir -p dist
          cp "$output_root/r105-$VERSION-r0.apk" dist/
      - uses: actions/upload-artifact@v7
        with:
          name: package-alpine
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [validate, binaries, linux-packages, freebsd, alpine]
    if: ${{ always() && needs.validate.result == 'success' && needs.binaries.result == 'success' && needs.linux-packages.result == 'success' && needs.freebsd.result == 'success' && needs.alpine.result != 'cancelled' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' -o -name '*.pkg' -o -name '*.apk' \) -exec cp {} release-assets/ \;
          (cd release-assets && sha256sum * > SHA256SUMS)
          test -f "release-assets/r105-linux-x86_64.tar.gz"
          test -f "release-assets/r105-linux-aarch64.tar.gz"
          test -f "release-assets/r105-macos-x86_64.tar.gz"
          test -f "release-assets/r105-macos-arm64.tar.gz"
          test -f "release-assets/r105-windows-x86_64.zip"
          test -f "release-assets/r105-windows-arm64.zip"
          test -f "release-assets/r105_"$VERSION"_amd64.deb"
          test -f "release-assets/r105-$VERSION-1.x86_64.rpm"
          test -f "release-assets/r105-$VERSION-1-x86_64.pkg.tar.zst"
          test -f "release-assets/r105-$VERSION-freebsd-amd64.pkg"
          find release-assets -maxdepth 1 -type f -print
      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')
          notes_file="docs/release-notes/v$VERSION.md"
          if [ -f "$notes_file" ]; then
            cp "$notes_file" release-notes.md
          else
            awk -v version="$VERSION" '
              $0 ~ "^## \\[" version "\\]" { in_release = 1; next }
              in_release && /^## \[/ { exit }
              in_release { print }
            ' CHANGELOG.md > release-notes.md
          fi
          test -s release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: release-notes.md
          generate_release_notes: false

  sync-formulas:
    name: Sync Homebrew and Scoop metadata
    needs: release
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p formula-assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir formula-assets \
            --pattern 'r105-linux-x86_64.tar.gz' \
            --pattern 'r105-linux-aarch64.tar.gz' \
            --pattern 'r105-macos-x86_64.tar.gz' \
            --pattern 'r105-macos-arm64.tar.gz' \
            --pattern 'r105-windows-x86_64.zip' \
            --pattern 'r105-windows-arm64.zip'
      - name: Render binary formulas
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')
          linux_x64=$(sha256sum formula-assets/r105-linux-x86_64.tar.gz | awk '{print $1}')
          linux_arm=$(sha256sum formula-assets/r105-linux-aarch64.tar.gz | awk '{print $1}')
          mac_x64=$(sha256sum formula-assets/r105-macos-x86_64.tar.gz | awk '{print $1}')
          mac_arm=$(sha256sum formula-assets/r105-macos-arm64.tar.gz | awk '{print $1}')
          sed -e "s/__VERSION__/$VERSION/g" \
              -e "s/__LINUX_X86_64_SHA256__/$linux_x64/g" \
              -e "s/__LINUX_AARCH64_SHA256__/$linux_arm/g" \
              -e "s/__MACOS_X86_64_SHA256__/$mac_x64/g" \
              -e "s/__MACOS_ARM64_SHA256__/$mac_arm/g" \
              docs/homebrew.rb.in > docs/homebrew.rb
          win_x64=$(sha256sum formula-assets/r105-windows-x86_64.zip | awk '{print $1}')
          win_arm=$(sha256sum formula-assets/r105-windows-arm64.zip | awk '{print $1}')
          jq --arg version "$VERSION" \
             --arg x64 "https://github.com/bnelabs/r105/releases/download/v$VERSION/r105-windows-x86_64.zip" \
             --arg x64sha "$win_x64" \
             --arg arm "https://github.com/bnelabs/r105/releases/download/v$VERSION/r105-windows-arm64.zip" \
             --arg armsha "$win_arm" \
             '.version = $version |
              .architecture["64bit"].url = $x64 |
              .architecture["64bit"].hash = $x64sha |
              .architecture["arm64"].url = $arm |
              .architecture["arm64"].hash = $armsha |
              .autoupdate.architecture["64bit"].url = "https://github.com/bnelabs/r105/releases/download/v$version/r105-windows-x86_64.zip" |
              .autoupdate.architecture["arm64"].url = "https://github.com/bnelabs/r105/releases/download/v$version/r105-windows-arm64.zip"' \
             docs/scoop.json > docs/scoop.json.tmp
          mv docs/scoop.json.tmp docs/scoop.json
      - name: Update Homebrew tap when configured
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tap_token=$(printenv HOMEBREW_TAP_TOKEN || true)
          if [ -z "$tap_token" ]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; leaving tap sync for a maintainer"
            exit 0
          fi
          export GH_TOKEN="$tap_token"
          gh auth setup-git
          tap_dir="$RUNNER_TEMP/homebrew-tap"
          gh repo clone bnelabs/homebrew-tap "$tap_dir"
          mkdir -p "$tap_dir/Formula"
          cp docs/homebrew.rb "$tap_dir/Formula/r105.rb"
          git -C "$tap_dir" config user.name "r105 release bot"
          git -C "$tap_dir" config user.email "bot@r105.dev"
          git -C "$tap_dir" add Formula/r105.rb
          if ! git -C "$tap_dir" diff --cached --quiet; then
            git -C "$tap_dir" commit -m "Update r105 formula to $GITHUB_REF_NAME"
            git -C "$tap_dir" push origin HEAD:main
          fi
      - name: Commit repository metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "r105 release bot"
          git config user.email "bot@r105.dev"
          git add docs/homebrew.rb docs/scoop.json
          if ! git diff --cached --quiet; then
            git commit -m "Update native package metadata for $GITHUB_REF_NAME"
            git push origin HEAD:main
          fi
